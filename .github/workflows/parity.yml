name: Parity

# Lite-vs-SaaS pixel parity (VIEW-01..06, D-11). No path filters: a required check
# that a filter skipped would sit "Pending" forever and block merges. Instead the
# job always starts, decides in its first step whether the change can affect the
# rendering, and skips the heavy steps (each guarded by the same `if:`) when it
# cannot, so it always reports a status.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    # The image tag equals the pinned @playwright/test version (guarded by
    # tests/guards/ci-config.test.js), so the browser build matches the library.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE="${PR_BASE:-$PUSH_BEFORE}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit: running parity."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PATTERN='^(packages/(core|tokens|app|parity)/|css/|js/|index\.html$|tests/fixtures/|tests/helpers/|package(-lock)?\.json$|\.github/workflows/parity\.yml$)'
          if git diff --name-only "$BASE" HEAD | grep -Eq "$PATTERN"; then
            echo "Relevant files changed: running parity."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant files changed: skipping the heavy steps."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: npm ci --workspace=packages/core --workspace=packages/tokens --workspace=packages/app --workspace=packages/parity --include-workspace-root

      - name: Seed config.js from base template
        if: steps.changes.outputs.run == 'true'
        run: cp js/config_base.js js/config.js

      - name: Build Lite and the SaaS parity entry
        if: steps.changes.outputs.run == 'true'
        run: node packages/parity/scripts/build-targets.mjs --lite-head --saas

      - name: Run the parity suite
        if: steps.changes.outputs.run == 'true'
        run: npx playwright test -c packages/parity

      - name: Upload parity results
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parity-test-results
          path: packages/parity/test-results

      - name: Report
        if: always()
        run: echo "Parity ran - ${{ steps.changes.outputs.run }}"
