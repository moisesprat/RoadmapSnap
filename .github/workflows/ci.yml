name: CI

# Lite + shared core. No path filters: a change under packages/core or
# packages/tokens must always run the Lite tests (CORE-03), and a required
# check must never sit "Pending" because a filter skipped it.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Light install: Lite, packages/core and packages/tokens only. The app and
      # API dependencies are not needed for the Lite checks.
      - name: Install dependencies
        run: npm ci --workspace=packages/core --workspace=packages/tokens --include-workspace-root

      - name: Seed config.js from base template
        run: cp js/config_base.js js/config.js

      - name: Run tests
        run: npm test

      - name: Type check shared core
        run: npm run typecheck -w @roadmapsnap/core

      - name: Run config validation
        run: npm run validate

      - name: Run build
        run: npm run build

      - name: All checks passed
        run: echo '✅ All checks passed'
