name: App CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci -w @roadmapsnap/app

      - name: Type check
        run: npm run typecheck -w @roadmapsnap/app

      - name: Run tests
        env:
          VITE_AUTH0_DOMAIN: placeholder.auth0.com
          VITE_AUTH0_CLIENT_ID: placeholder-client-id
          VITE_AUTH0_AUDIENCE: https://api.roadmapsnap.local
          VITE_API_URL: http://localhost:4000
        run: npm test -w @roadmapsnap/app

      - name: Build
        run: npm run build -w @roadmapsnap/app

      - name: App CI passed
        run: echo '✅ App CI passed'
