name: API CI

on:
  push:
    paths: ['packages/api/**', 'package.json', 'package-lock.json', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['packages/api/**', 'package.json', 'package-lock.json', '.github/workflows/api-ci.yml']
  workflow_dispatch:

jobs:
  api-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roadmapsnap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install API dependencies
        run: npm ci -w @roadmapsnap/api

      - name: Pre-create app role
        run: |
          psql postgresql://postgres:postgres@localhost:5432/roadmapsnap_test \
            -c "CREATE ROLE roadmapsnap_app WITH LOGIN PASSWORD 'apppassword' NOSUPERUSER;" \
            || true

      - name: Run migrations
        run: npm run migrate -w @roadmapsnap/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roadmapsnap_test

      - name: Run API tests
        run: npm test -w @roadmapsnap/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roadmapsnap_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roadmapsnap_test
          APP_DATABASE_URL: postgresql://roadmapsnap_app:apppassword@localhost:5432/roadmapsnap_test
          AUTH0_DOMAIN: placeholder.auth0.com
          AUTH0_AUDIENCE: http://localhost:4000
          PORT: "4000"

      - name: Run date tests under non-UTC timezones
        run: npm run test:tz -w @roadmapsnap/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roadmapsnap_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roadmapsnap_test
          APP_DATABASE_URL: postgresql://roadmapsnap_app:apppassword@localhost:5432/roadmapsnap_test
          AUTH0_DOMAIN: placeholder.auth0.com
          AUTH0_AUDIENCE: http://localhost:4000
          PORT: "4000"

      - name: API CI passed
        run: echo '✅ API CI passed'
